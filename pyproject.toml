[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ROIpy"
version = "0.1.0"
description = "Python package for ROI semi-automatic generation and placement for functional imaging of neuronal dendrites"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "dcupolillo"}
]
keywords = ["roi", "imaging", "neuron", "dendrite", "scanimage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.23.5",
    "pandas>=1.5.3",
    "matplotlib>=3.8.2",
    "tifffile>=2024.2.12",
    "h5py>=3.9",
    "flammkuchen",
    "PyQt5>=5.15.10",
    "pyqtgraph>=0.13.3",
    "shapely>=2.0",
]

[project.urls]
Homepage = "https://github.com/dcupolillo/ROIpy"
Documentation = "https://github.com/dcupolillo/ROIpy#readme"
Repository = "https://github.com/dcupolillo/ROIpy.git"
"Bug Tracker" = "https://github.com/dcupolillo/ROIpy/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
ROIpy = ["py.typed"]
